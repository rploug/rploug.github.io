<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DigiDidactic Model Interactive</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f3f3f3;
      }

      #model-wrapper {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
      }

      #model-wrapper svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* All interactive segments */
      .dd-segment {
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
        transform-box: fill-box;
        transform-origin: center;
        outline: none;
      }

      .dd-segment:hover {
        transform: scale(1.03);
        filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
      }

      .dd-segment:focus,
      .dd-segment:focus-visible {
        outline: none;
      }

      /* Popup on top of the figure */
      #info-box {
        position: absolute;
        top: 45%;
        left: 15%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.97);
        border-radius: 8px;
        padding: 0.9rem 1.1rem 1.05rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        display: none;
        max-width: 360px;
        z-index: 10;
      }

      #info-title {
        margin: 0 0 0.35rem 0;
        font-size: 1rem;
        font-weight: 600;
      }

      #info-text {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      #info-close {
        position: absolute;
        top: 4px;
        right: 8px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
      }
    </style>
  </head>

    <!-- Popup content box -->
    <div id="info-box">
      <button id="info-close" aria-label="Close">&times;</button>
      <h3 id="info-title"></h3>
      <p id="info-text"></p>
    </div>

    <script>
      const segmentInfo = {
        DigitalLiteracy: {
          title: "Digital Literacy",
          body: "Covers students’ critical, reflective, and constructive use of digital technology. Includes digital empowerment, ethical awareness, critical thinking, computational thinking, IT security, and the ability to participate in communities of practice. Digital literacy is not only about skills, but about understanding how technologies shape knowledge, society, and students’ own lives.",
        },
        Sustainability: {
          title: "Sustainability",
          body: "A cross cutting focus that should be considered in all dimensions of the model. Draws on the balance between environmental, economic, and social well being. Includes working with sustainability themes in teaching, considering environmental effects and technology waste (digitainability), reusing designs, materials, and infrastructures, and supporting students’ psycho social well being and inclusion, often linked to the UN Sustainable Development Goals.",
        },
        EthicsAndSociety: {
          title: "Ethics and Society",
          body: "Addresses how digital technologies affect climate, security, the economy, democracy, and everyday life. Focuses on ethical dilemmas, power relations, and who benefits from technological solutions. Encourages students to reflect on the societal consequences of automation, AI, data use, and digital platforms, and to develop a responsible stance toward their own digital productions.",
        },
        ITsecurity: {
          title: "IT Security",
          body: "Relates to cybersecurity and personal data protection as part of digital literacy. Includes safe handling of passwords, identities, and platforms, awareness of data traces and tracking, and understanding basic security risks. Supports students in navigating digital learning environments safely and in designing digital products that respect privacy and data protection rules.",
        },
        CriticalThinking: {
          title: "Critical Thinking",
          body: "Supports students in weighing advantages, disadvantages, and consequences of using specific technologies. Includes source criticism, questioning data and AI outputs, reflecting on bias and automation, and evaluating digital solutions from multiple perspectives, including ethical and societal ones. Forms a core part of digital empowerment.",
        },
        IndividualRelevance: {
          title: "Individual Relevance",
          body: "Connects technologies and teaching modules to students’ own lives, leisure activities, interests, educational choices, and future plans. Design cases, themes, and examples are chosen so that they feel meaningful and motivating for the specific target group and level. This strengthens engagement and supports personal learning pathways.",
        },
        Methods: {
          title: "Methods",
          body: "The overall strategies used for digital production and teaching, chosen based on time frame, educational level, target group, and learning objectives. Can include problem based learning, project work, iterative design processes, pair programming, worked examples, or other practice based approaches. Different methods can be combined across a module.",
        },
        Reflections: {
          title: "Reflections",
          body: "Planned activities where students and teachers step back from action to reflect on process and product. Includes ongoing reflection during work and retrospective reflections afterwards, where students describe and justify their technical solutions, use relevant concepts, and connect their experiences to underlying theories and didactic choices.",
        },
        DigitalProduction: {
          title: "Digital Production",
          body: "One of the three core dimensions. Focuses on the technological part of the learning process where students create digital artifacts, for example programs, games, simulations, AR or VR experiences, digital stories, or interactive prototypes. Emphasizes that students work hands on with emerging technologies and make concrete digital products that can be shared and reused.",
        },
        TeachingDesign: {
          title: "Teaching Design",
          body: "One of the three core dimensions. Covers the classic didactic planning elements: defining learning objectives, involving students’ co influence, choosing content and activities, specifying students’ learning products, selecting pedagogical methods, and planning evaluations. Teaching design ensures the module is meaningful for the specific subject, level, and target group.",
        },
        Environment: {
          title: "Environment",
          body: "One of the three core dimensions, focusing on the ecosystem around the educational institution. Includes collaboration with external partners, career learning, cross institutional links in the education chain, and connections to broader digitalization in society. Supports coherence across levels and sectors, and helps students see how digital technologies matter in the world outside school.",
        },
        ChoiceOfTechnology: {
          title: "Choice of Technology",
          body: "Concerns the deliberate selection of equipment, software, and platforms for the main digital production and any supporting media tools. Includes considering availability, accessibility, cost, and the fit between technologies, learning objectives, and target group. Can range from programming languages and robots to AR or VR platforms, AI tools, and collaborative online environments.",
        },
        CareerLearning: {
          title: "Career Learning",
          body: "Uses teaching modules to support students in exploring study and career paths. Includes activities with companies or other institutions, transition courses between levels, and structured reflection before, during, and after modules on what the experience means for future education and work. The goal is to help students make personally meaningful choices in a complex education chain.",
        },
        InternationalAspects: {
          title: "International Aspects",
          body: "Highlights that teaching with digital production can cross national borders and connect students across countries. In DigiDidactics this is exemplified by Danish German collaboration, but the idea is broader: to work with international partners, multilingual communication, and global perspectives on technology, sustainability, and digitalization.",
        },
        "Cross-diciplinaryCollaboration": {
          title: "Cross-disciplinary Collaboration",
          body: "Designs modules where multiple subjects, professions, or institutions work together around shared digital productions or cases. Students meet different perspectives and ways of working, often anchored in real life problems or external stakeholders. This supports authentic problem solving and helps bridge gaps in the education chain.",
        },
        BusinessAndAddedValue: {
          title: "Business and Added Value",
          body: "Relates to collaboration with companies and other organizations and to value creation in and around the teaching module. Can include user studies, market perspectives on students’ products, role models from industry, or reflection on how digital solutions create economic or social value for stakeholders. Also covers institutional value such as reusability of modules and visibility.",
        },
        IterativeDesign: {
          title: "Iterative Design",
          body: "A structured approach where digital products and teaching designs are developed in repeated cycles. Each iteration includes planning, design, testing, evaluation, and adjustment. Longer modules can be organized into several iterations to gradually improve both the technical quality and the alignment with learning objectives and user needs.",
        },
        ExperimentsPlayground: {
          title: "Experiments / Playground",
          body: "Safe spaces and phases in the module where students can play with technologies, test ideas, and explore functions with minimal upfront instruction. The focus is on experimentation, curiosity, and innovation rather than polished products. This reduces fear of failure and can generate concepts that are later refined through more structured work.",
        },
        KnowledgeTerms: {
          title: "Knowledge / Terms",
          body: "Central theoretical and didactic concepts that support the use of the model, for example digital literacy, computational thinking, empowerment, education chain, sustainability, and iterative design. Making such terms explicit helps align teachers’ communication, supports shared reflection, and strengthens the meta level understanding of teaching with digital production.",
        },
        ProductDevelopment: {
          title: "Product Development",
          body: "The concrete workflow from early idea to finished digital product. Includes idea generation, concept development, storyboarding or scripting, prototyping, testing with users or peers, and final polishing and documentation. Encourages students to treat their digital work as something that can be improved, reused, and shared beyond the single module.",
        },
        LearningObjectives: {
          title: "Learning Objectives",
          body: "Expected competencies in terms of knowledge, skills, and attitudes that students should develop during the module. Can be technical, subject specific, social, or personal. Objectives should align with local curricula and regulations and help define relevant content, activities, and digital products for the given target group.",
        },
        "StudentsCo-influence": {
          title: "Students’ Co-influence",
          body: "Students are actively involved in planning and shaping the module. They can help choose themes, cases, target groups, locations, or technologies, and suggest issues they want to investigate. Co influence can also concern how lessons are structured. This supports motivation, ownership, and alignment with students’ lives and interests.",
        },
        ContentActivitiesFrameworks: {
          title: "Content/Activities/Frameworks",
          body: "The subjects, topics, and concrete learning activities that make up the module, for example investigations, experiments, project work, presentations, or competitions. Also includes the physical and virtual framework, such as locations, equipment, and digital platforms. These choices should support the learning objectives and fit the target group.",
        },
        StudentsLearningProducts: {
          title: "Students’ Learning Products",
          body: "The required outputs that document students’ learning and form the core of digital production, for example programs, games, AR or VR scenes, prototypes, digital stories, posters, or flowcharts. Products will often have technical or qualitative criteria and can be designed to be shared, reused, or further developed by others.",
        },
        "PedagogicalMethodsSocialWell-being": {
          title: "Pedagogical Methods / Social Well-being",
          body: "Covers the didactic methods used to support motivation, creativity, collaboration, and inclusion. Examples include structured group work, differentiated teaching, peer learning, playground methods, and game based elements. Particular focus is placed on social interaction, constructive feedback, and accessibility so that all students can participate meaningfully.",
        },
        Evaluations: {
          title: "Evaluations",
          body: "Defines who evaluates what and how. Includes assessment of students’ learning processes and products, but also evaluation of the module itself. Methods can range from grades and rubrics to oral or written feedback, self evaluation, and peer evaluation. Results should feed back into iterative improvement of both teaching design and digital products.",
        },
        Instructions: {
          title: "Instructions",
          body: "Covers the scaffolding and guidance that help students navigate complex digital tasks. Includes clear task descriptions, criteria for success, examples, templates, and stepwise introductions to tools. Good instructions are especially important when working with emerging technologies so that students have a starting point while still having room for exploration.",
        },
        Center: {
          title: "Center",
          body: "The student and the learning process at the heart of the model. All dimensions and elements of DigiDidactics are intended to support meaningful, motivating, and sustainable learning for concrete target groups across the education chain. The model follows a pick and play principle, where a small selection of elements is combined around students’ needs and context.",
        },
      };

      (function () {
        function init() {
          const wrapper = document.getElementById("model-wrapper");
          const svg = wrapper.querySelector("svg");
          if (!svg) return;

          const infoBox = document.getElementById("info-box");
          const infoTitle = document.getElementById("info-title");
          const infoText = document.getElementById("info-text");
          const infoClose = document.getElementById("info-close");

          // Special elements
          const centerEl = svg.getElementById ? svg.getElementById("Center") : document.getElementById("Center");

          const sustainabilityEl = svg.getElementById ? svg.getElementById("Sustainability") : document.getElementById("Sustainability");

          const digitalLiteracyEl = svg.getElementById ? svg.getElementById("DigitalLiteracy") : document.getElementById("DigitalLiteracy");

          Object.keys(segmentInfo).forEach((id) => {
            const el = svg.getElementById ? svg.getElementById(id) : document.getElementById(id);

            if (!el) return;

            el.classList.add("dd-segment");
            el.setAttribute("tabindex", "0");
            el.setAttribute("role", "button");

            // Bring to front logic with ordering constraints
            el.addEventListener("mouseenter", () => {
              const parent = el.parentNode;
              if (!parent) return;

              // 1) Center: never move, always top
              if (centerEl && el === centerEl) return;

              // 2) Sustainability: always just under Center
              if (centerEl && sustainabilityEl && el === sustainabilityEl) {
                parent.insertBefore(sustainabilityEl, centerEl);
                return;
              }

              // 3) DigitalLiteracy: always under Sustainability
              if (sustainabilityEl && digitalLiteracyEl && el === digitalLiteracyEl) {
                const parentS = sustainabilityEl.parentNode;
                if (parentS === parent) {
                  parent.insertBefore(digitalLiteracyEl, sustainabilityEl);
                } else {
                  parent.appendChild(digitalLiteracyEl);
                }
                return;
              }

              // 4) Any other segment:
              //    put it just under Sustainability (if possible),
              //    otherwise just under Center,
              //    otherwise at the very end of its parent.
              if (sustainabilityEl && parent === sustainabilityEl.parentNode) {
                parent.insertBefore(el, sustainabilityEl);
              } else if (centerEl && parent === centerEl.parentNode) {
                parent.insertBefore(el, centerEl);
              } else {
                parent.appendChild(el);
              }
            });

            el.addEventListener("click", () => {
              const data = segmentInfo[id];
              infoTitle.textContent = data.title || id;
              infoText.textContent = data.body || "";
              infoBox.style.display = "block";
            });

            el.addEventListener("keypress", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                el.click();
              }
            });
          });

          infoClose.addEventListener("click", () => {
            infoBox.style.display = "none";
          });

          wrapper.addEventListener("click", (e) => {
            if (!infoBox.contains(e.target) && e.target.closest(".dd-segment") == null) {
              infoBox.style.display = "none";
            }
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
