<style>
  #lang-switch {
  position: fixed;
  top: 12px;
  right: 12px;
  background: white;
  padding: 6px 10px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  z-index: 9999;
  display: flex;
  gap: 6px;
}

.lang-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.lang-link svg {
  width: 24px;
  height: 18px;
  border-radius: 3px;
  opacity: 0.6;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.lang-link:hover svg {
  opacity: 1;
  transform: scale(1.08);
}

.lang-link.active svg {
  opacity: 1;
  transform: scale(1.12);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
}

</style>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0rem;
        background: #ffffff;
      }

      
#model-wrapper {
  width: auto;
  height: 100vh;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;  /* centers the SVG */
  overflow: hidden;
}

#model-wrapper svg {
  height: 100%;
  width: auto;       /* width adjusts automatically */
  display: block;
}

      /* All interactive segments */
      .dd-segment {
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
        transform-box: fill-box;
        transform-origin: center;
        outline: none;
      }

      .dd-segment:hover {
        transform: scale(1.03);
        filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
      }

      .dd-segment:focus,
      .dd-segment:focus-visible {
        outline: none;
      }

      /* Popup on top of the figure */
      #info-box {
        position: absolute;
        top: 45%;
        left: 15%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.97);
        border-radius: 8px;
        padding: 0.9rem 1.1rem 1.05rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        display: none;
        max-width: 360px;
        z-index: 10;
      }

      #info-title {
        margin: 0 0 0.35rem 0;
        font-size: 1rem;
        font-weight: 600;
      }

      #info-text {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      #info-close {
        position: absolute;
        top: 4px;
        right: 8px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
      }
    </style>
  </head>

      (function () {
        function init() {
          const wrapper = document.getElementById("model-wrapper");
          const svg = wrapper.querySelector("svg");
          if (!svg) return;

          const infoBox = document.getElementById("info-box");
          const infoTitle = document.getElementById("info-title");
          const infoText = document.getElementById("info-text");
          const infoClose = document.getElementById("info-close");
          // --- Draggable popup (desktop only) ---
          let isDragging = false;
          let dragOffsetX = 0;
          let dragOffsetY = 0;

          function startDrag(e) {
            if (infoBox.style.display === "none") return;
            if (window.innerWidth <= 700) return; // don't drag on mobile layout

            isDragging = true;

            const pointer = e.touches ? e.touches[0] : e;
            const rect = infoBox.getBoundingClientRect();

            // Lock current visual position and drop the centering transform
            infoBox.style.transform = "none";
            infoBox.style.left = rect.left + window.scrollX + "px";
            infoBox.style.top = rect.top + window.scrollY + "px";

            // How far from the box's top-left the pointer is
            dragOffsetX = pointer.clientX - rect.left;
            dragOffsetY = pointer.clientY - rect.top;

            document.addEventListener("pointermove", onDragMove);
            document.addEventListener("pointerup", stopDrag);
          }

          function onDragMove(e) {
            if (!isDragging) return;

            const pointer = e.touches ? e.touches[0] : e;

            const newLeft = pointer.clientX - dragOffsetX + window.scrollX;
            const newTop = pointer.clientY - dragOffsetY + window.scrollY;

            infoBox.style.left = newLeft + "px";
            infoBox.style.top = newTop + "px";
          }

          function stopDrag() {
            isDragging = false;
            document.removeEventListener("pointermove", onDragMove);
            document.removeEventListener("pointerup", stopDrag);
          }

          // Start dragging when pressing on the popup (but not the X)
          infoBox.addEventListener("pointerdown", (e) => {
            if (e.target === infoClose) return;
            startDrag(e);
          });

          // Special elements
          const centerEl = svg.getElementById ? svg.getElementById("Center") : document.getElementById("Center");

          const sustainabilityEl = svg.getElementById ? svg.getElementById("Sustainability") : document.getElementById("Sustainability");

          const digitalLiteracyEl = svg.getElementById ? svg.getElementById("DigitalLiteracy") : document.getElementById("DigitalLiteracy");

          Object.keys(segmentInfo).forEach((id) => {
            const el = svg.getElementById ? svg.getElementById(id) : document.getElementById(id);

            if (!el) return;

            el.classList.add("dd-segment");
            el.setAttribute("tabindex", "0");
            el.setAttribute("role", "button");

            // Bring to front logic with ordering constraints
            el.addEventListener("mouseenter", () => {
              const parent = el.parentNode;
              if (!parent) return;

              // 1) Center: never move, always top
              if (centerEl && el === centerEl) return;

              // 2) Sustainability: always just under Center
              if (centerEl && sustainabilityEl && el === sustainabilityEl) {
                parent.insertBefore(sustainabilityEl, centerEl);
                return;
              }

              // 3) DigitalLiteracy: always under Sustainability
              if (sustainabilityEl && digitalLiteracyEl && el === digitalLiteracyEl) {
                const parentS = sustainabilityEl.parentNode;
                if (parentS === parent) {
                  parent.insertBefore(digitalLiteracyEl, sustainabilityEl);
                } else {
                  parent.appendChild(digitalLiteracyEl);
                }
                return;
              }

              // 4) Any other segment:
              //    put it just under Sustainability (if possible),
              //    otherwise just under Center,
              //    otherwise at the very end of its parent.
              if (sustainabilityEl && parent === sustainabilityEl.parentNode) {
                parent.insertBefore(el, sustainabilityEl);
              } else if (centerEl && parent === centerEl.parentNode) {
                parent.insertBefore(el, centerEl);
              } else {
                parent.appendChild(el);
              }
            });

            el.addEventListener("click", () => {
              const data = segmentInfo[id];
              infoTitle.textContent = data.title || id;
              infoText.textContent = data.body || "";
              infoBox.style.display = "block";
            });

            el.addEventListener("keypress", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                el.click();
              }
            });
          });

          infoClose.addEventListener("click", () => {
            infoBox.style.display = "none";
          });

          wrapper.addEventListener("click", (e) => {
            if (!infoBox.contains(e.target) && e.target.closest(".dd-segment") == null) {
              infoBox.style.display = "none";
            }
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
